# ACME DNS-01 provider catalog — SEED ONLY (INSERT-ONLY at boot).
#
# Same contract as endpoints*.yaml: this file seeds the `acme_dns_providers`
# table on boot and NEVER overwrites a row that already exists. The operator
# owns the table afterwards (Settings → Certificate Manager → DNS providers):
# editing a provider, adding a new one or disabling one is a DATA change, not
# a deploy. Shipping support for a new DNS provider = one row.
#
# `flag`  -> the value passed to the ACME client's DNS selector
#            (lego: `--dns <flag>`).
# `fields`-> the environment variables that provider reads. The UI renders this
#            list verbatim; values marked `secret: true` are Fernet-encrypted at
#            rest, never returned to the browser and redacted from every log.
#
# Env-var names follow the lego provider documentation (`doc:` on each entry).
# If an upstream release renames one, EDIT THE ROW in the UI — no code change.
version: 1
providers:

  # ---- big cloud / CDN -----------------------------------------------------
  - slug: cloudflare
    label: Cloudflare
    flag: cloudflare
    doc: https://go-acme.github.io/lego/dns/cloudflare/
    fields:
      - {env: CF_DNS_API_TOKEN, label: "API token (Zone:DNS:Edit)", secret: true, required: true}
      - {env: CF_ZONE_API_TOKEN, label: "Zone API token (only if separate)", secret: true}

  - slug: route53
    label: AWS Route 53
    flag: route53
    doc: https://go-acme.github.io/lego/dns/route53/
    fields:
      - {env: AWS_ACCESS_KEY_ID, label: "Access key id", required: true}
      - {env: AWS_SECRET_ACCESS_KEY, label: "Secret access key", secret: true, required: true}
      - {env: AWS_REGION, label: "Region", help: "e.g. us-east-1"}
      - {env: AWS_HOSTED_ZONE_ID, label: "Hosted zone id (optional — skips lookup)"}

  - slug: gcloud
    label: Google Cloud DNS
    flag: gcloud
    doc: https://go-acme.github.io/lego/dns/gcloud/
    fields:
      - {env: GCE_PROJECT, label: "Project id", required: true}
      - {env: GCE_SERVICE_ACCOUNT_FILE, label: "Service-account JSON path", required: true}

  - slug: azuredns
    label: Azure DNS
    flag: azuredns
    doc: https://go-acme.github.io/lego/dns/azuredns/
    fields:
      - {env: AZURE_TENANT_ID, label: "Tenant id", required: true}
      - {env: AZURE_CLIENT_ID, label: "Client id", required: true}
      - {env: AZURE_CLIENT_SECRET, label: "Client secret", secret: true, required: true}
      - {env: AZURE_SUBSCRIPTION_ID, label: "Subscription id", required: true}
      - {env: AZURE_RESOURCE_GROUP, label: "Resource group", required: true}

  - slug: digitalocean
    label: DigitalOcean
    flag: digitalocean
    doc: https://go-acme.github.io/lego/dns/digitalocean/
    fields:
      - {env: DO_AUTH_TOKEN, label: "API token", secret: true, required: true}

  - slug: linode
    label: Linode (Akamai)
    flag: linode
    doc: https://go-acme.github.io/lego/dns/linode/
    fields:
      - {env: LINODE_TOKEN, label: "API token", secret: true, required: true}

  - slug: vultr
    label: Vultr
    flag: vultr
    doc: https://go-acme.github.io/lego/dns/vultr/
    fields:
      - {env: VULTR_API_KEY, label: "API key", secret: true, required: true}

  - slug: hetzner
    label: Hetzner DNS
    flag: hetzner
    doc: https://go-acme.github.io/lego/dns/hetzner/
    fields:
      - {env: HETZNER_API_KEY, label: "API token", secret: true, required: true}

  - slug: scaleway
    label: Scaleway
    flag: scaleway
    doc: https://go-acme.github.io/lego/dns/scaleway/
    fields:
      - {env: SCALEWAY_API_TOKEN, label: "API token", secret: true, required: true}
      - {env: SCALEWAY_PROJECT_ID, label: "Project id"}

  - slug: alidns
    label: Alibaba Cloud DNS
    flag: alidns
    doc: https://go-acme.github.io/lego/dns/alidns/
    fields:
      - {env: ALICLOUD_ACCESS_KEY, label: "Access key", required: true}
      - {env: ALICLOUD_SECRET_KEY, label: "Secret key", secret: true, required: true}

  - slug: tencentcloud
    label: Tencent Cloud DNSPod
    flag: tencentcloud
    doc: https://go-acme.github.io/lego/dns/tencentcloud/
    fields:
      - {env: TENCENTCLOUD_SECRET_ID, label: "Secret id", required: true}
      - {env: TENCENTCLOUD_SECRET_KEY, label: "Secret key", secret: true, required: true}

  # ---- registrars ----------------------------------------------------------
  - slug: godaddy
    label: GoDaddy
    flag: godaddy
    doc: https://go-acme.github.io/lego/dns/godaddy/
    fields:
      - {env: GODADDY_API_KEY, label: "API key", required: true}
      - {env: GODADDY_API_SECRET, label: "API secret", secret: true, required: true}

  - slug: namecheap
    label: Namecheap
    flag: namecheap
    doc: https://go-acme.github.io/lego/dns/namecheap/
    fields:
      - {env: NAMECHEAP_API_USER, label: "API user", required: true}
      - {env: NAMECHEAP_API_KEY, label: "API key", secret: true, required: true}

  - slug: namedotcom
    label: Name.com
    flag: namedotcom
    doc: https://go-acme.github.io/lego/dns/namedotcom/
    fields:
      - {env: NAMECOM_USERNAME, label: "Username", required: true}
      - {env: NAMECOM_API_TOKEN, label: "API token", secret: true, required: true}

  - slug: porkbun
    label: Porkbun
    flag: porkbun
    doc: https://go-acme.github.io/lego/dns/porkbun/
    fields:
      - {env: PORKBUN_API_KEY, label: "API key", required: true}
      - {env: PORKBUN_SECRET_API_KEY, label: "Secret API key", secret: true, required: true}

  - slug: gandiv5
    label: Gandi LiveDNS (v5)
    flag: gandiv5
    doc: https://go-acme.github.io/lego/dns/gandiv5/
    fields:
      - {env: GANDIV5_PERSONAL_ACCESS_TOKEN, label: "Personal access token", secret: true}
      - {env: GANDIV5_API_KEY, label: "API key (legacy)", secret: true}

  - slug: ovh
    label: OVHcloud
    flag: ovh
    doc: https://go-acme.github.io/lego/dns/ovh/
    fields:
      - {env: OVH_ENDPOINT, label: "Endpoint", help: "ovh-eu | ovh-ca | ovh-us", required: true}
      - {env: OVH_APPLICATION_KEY, label: "Application key", required: true}
      - {env: OVH_APPLICATION_SECRET, label: "Application secret", secret: true, required: true}
      - {env: OVH_CONSUMER_KEY, label: "Consumer key", secret: true, required: true}

  - slug: inwx
    label: INWX
    flag: inwx
    doc: https://go-acme.github.io/lego/dns/inwx/
    fields:
      - {env: INWX_USERNAME, label: "Username", required: true}
      - {env: INWX_PASSWORD, label: "Password", secret: true, required: true}
      - {env: INWX_SHARED_SECRET, label: "TOTP shared secret (if 2FA)", secret: true}

  - slug: netcup
    label: netcup
    flag: netcup
    doc: https://go-acme.github.io/lego/dns/netcup/
    fields:
      - {env: NETCUP_CUSTOMER_NUMBER, label: "Customer number", required: true}
      - {env: NETCUP_API_KEY, label: "API key", required: true}
      - {env: NETCUP_API_PASSWORD, label: "API password", secret: true, required: true}

  - slug: dnsimple
    label: DNSimple
    flag: dnsimple
    doc: https://go-acme.github.io/lego/dns/dnsimple/
    fields:
      - {env: DNSIMPLE_OAUTH_TOKEN, label: "OAuth token", secret: true, required: true}
      - {env: DNSIMPLE_BASE_URL, label: "Base URL (sandbox)"}

  - slug: dnsmadeeasy
    label: DNS Made Easy
    flag: dnsmadeeasy
    doc: https://go-acme.github.io/lego/dns/dnsmadeeasy/
    fields:
      - {env: DNSMADEEASY_API_KEY, label: "API key", required: true}
      - {env: DNSMADEEASY_API_SECRET, label: "API secret", secret: true, required: true}

  - slug: desec
    label: deSEC
    flag: desec
    doc: https://go-acme.github.io/lego/dns/desec/
    fields:
      - {env: DESEC_TOKEN, label: "API token", secret: true, required: true}

  - slug: hurricane
    label: Hurricane Electric
    flag: hurricane
    doc: https://go-acme.github.io/lego/dns/hurricane/
    fields:
      - {env: HURRICANE_TOKENS, label: "Per-domain tokens", secret: true, required: true,
         help: "domain:token[,domain:token…] — the dyn TXT key from dns.he.net"}

  # ---- self-hosted / enterprise DDI ---------------------------------------
  - slug: rfc2136
    label: RFC 2136 dynamic update (BIND, Knot…)
    flag: rfc2136
    doc: https://go-acme.github.io/lego/dns/rfc2136/
    fields:
      - {env: RFC2136_NAMESERVER, label: "Nameserver host[:port]", required: true}
      - {env: RFC2136_TSIG_KEY, label: "TSIG key name", required: true}
      - {env: RFC2136_TSIG_ALGORITHM, label: "TSIG algorithm", help: "e.g. hmac-sha256."}
      - {env: RFC2136_TSIG_SECRET, label: "TSIG secret", secret: true, required: true}

  - slug: powerdns
    label: PowerDNS
    flag: pdns
    doc: https://go-acme.github.io/lego/dns/pdns/
    fields:
      - {env: PDNS_API_URL, label: "API URL", required: true}
      - {env: PDNS_API_KEY, label: "API key", secret: true, required: true}
      - {env: PDNS_SERVER_NAME, label: "Server name", help: "default: localhost"}

  - slug: infoblox
    label: Infoblox NIOS
    flag: infoblox
    doc: https://go-acme.github.io/lego/dns/infoblox/
    fields:
      - {env: INFOBLOX_HOST, label: "Grid master host", required: true}
      - {env: INFOBLOX_USERNAME, label: "Username", required: true}
      - {env: INFOBLOX_PASSWORD, label: "Password", secret: true, required: true}
      - {env: INFOBLOX_VIEW, label: "DNS view"}
      - {env: INFOBLOX_WAPI_VERSION, label: "WAPI version"}

  - slug: designate
    label: OpenStack Designate
    flag: designate
    doc: https://go-acme.github.io/lego/dns/designate/
    fields:
      - {env: OS_AUTH_URL, label: "Auth URL", required: true}
      - {env: OS_USERNAME, label: "Username", required: true}
      - {env: OS_PASSWORD, label: "Password", secret: true, required: true}
      - {env: OS_PROJECT_NAME, label: "Project name"}
      - {env: OS_REGION_NAME, label: "Region"}

  # ---- generic escape hatches (any DNS with an API) ------------------------
  - slug: httpreq
    label: Generic HTTP endpoint (httpreq)
    flag: httpreq
    doc: https://go-acme.github.io/lego/dns/httpreq/
    fields:
      - {env: HTTPREQ_ENDPOINT, label: "Endpoint URL", required: true}
      - {env: HTTPREQ_MODE, label: "Mode", help: "empty or RAW"}
      - {env: HTTPREQ_USERNAME, label: "Basic-auth user"}
      - {env: HTTPREQ_PASSWORD, label: "Basic-auth password", secret: true}

  - slug: exec
    label: Custom hook script (exec)
    flag: exec
    doc: https://go-acme.github.io/lego/dns/exec/
    fields:
      - {env: EXEC_PATH, label: "Script path", required: true,
         help: "called as: <script> present|cleanup <fqdn> <token> <keyauth>"}
      - {env: EXEC_MODE, label: "Mode", help: "RAW for raw arguments"}
      - {env: EXEC_PROPAGATION_TIMEOUT, label: "Propagation timeout (s)"}

  # EfficientIP SOLIDserver has no native provider in any ACME client — it is
  # driven through the `exec` hook shipped with SATOM. EXEC_PATH is prefilled;
  # the SOLIDserver credentials are read by that script.
  - slug: efficientip
    label: EfficientIP SOLIDserver (via SATOM hook)
    flag: exec
    doc: https://<solidserver>/apidoc/
    fields:
      - {env: EXEC_PATH, label: "Hook script", required: true,
         default: /opt/satom/deploy/acme-hooks/efficientip.sh}
      - {env: EXEC_PROPAGATION_TIMEOUT, label: "Propagation timeout (s)", default: "120"}
      - {env: EFFICIENTIP_HOST, label: "SOLIDserver host", required: true}
      - {env: EFFICIENTIP_USER, label: "API user", required: true}
      - {env: EFFICIENTIP_PASSWORD, label: "API password", secret: true, required: true}
      - {env: EFFICIENTIP_DNS_NAME, label: "DNS server name (dns_name)", required: true}
      - {env: EFFICIENTIP_VIEW_NAME, label: "DNS view name (optional)"}
      - {env: EFFICIENTIP_INSECURE, label: "Skip TLS verify (1 = yes)"}
