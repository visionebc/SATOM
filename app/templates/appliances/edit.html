{% extends 'base.html' %}
{% block title %}Edit {{ appliance.name }} - Fortinet Manager{% endblock %}
{% block content %}
<div class="fw-page-header"><h4>Edit Appliance: {{ appliance.name }}</h4></div>
<div class="row"><div class="col-md-8">
<div class="card shadow-sm">
<div class="card-body">
<form method="post" action="{{ url_for('appliances.edit_save', id=appliance.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ appliance.name }}" required></div>
    <div class="col-md-6"><label class="form-label">Kind</label>
      <select name="kind" class="form-select">
        <option value="fortiweb" {{ 'selected' if appliance.kind=='fortiweb' }}>FortiWeb</option>
        <option value="fortiadc" {{ 'selected' if appliance.kind=='fortiadc' }}>FortiADC</option>
      </select>
    </div>
    <div class="col-md-8"><label class="form-label">Host</label><input type="text" name="host" class="form-control" value="{{ appliance.host }}" required></div>
    <div class="col-md-4"><label class="form-label">Port</label><input type="number" name="port" class="form-control" value="{{ appliance.port }}"></div>
    <div class="col-md-6"><label class="form-label">Username</label><input type="text" name="username" class="form-control" value="{{ appliance.username }}" required></div>
    <div class="col-md-6"><label class="form-label">New Password (leave blank to keep)</label><input type="password" name="password" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">VDOM</label><input type="text" name="vdom" class="form-control" value="{{ appliance.vdom or '' }}"></div>
    <div class="col-md-3"><label class="form-label">Zone</label><select name="zone" class="form-select"><option value="">(none)</option>{% if appliance.zone and appliance.zone not in classification.zones %}<option value="{{ appliance.zone }}" selected>{{ appliance.zone }} (unregistered)</option>{% endif %}{% for v in (classification.zones if classification else []) %}<option value="{{ v }}"{% if appliance.zone == v %} selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Line</label><select name="line" class="form-select"><option value="">(none)</option>{% if appliance.line and appliance.line not in classification.lines %}<option value="{{ appliance.line }}" selected>{{ appliance.line }} (unregistered)</option>{% endif %}{% for v in (classification.lines if classification else []) %}<option value="{{ v }}"{% if appliance.line == v %} selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Department</label><select name="department" class="form-select"><option value="">(none)</option>{% if appliance.department and appliance.department not in classification.departments %}<option value="{{ appliance.department }}" selected>{{ appliance.department }} (unregistered)</option>{% endif %}{% for v in (classification.departments if classification else []) %}<option value="{{ v }}"{% if appliance.department == v %} selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
    <div class="col-12"><div class="form-check"><input type="checkbox" name="verify_ssl" class="form-check-input" id="verify_ssl" {{ 'checked' if appliance.verify_ssl }}>
      <label class="form-check-label" for="verify_ssl">Verify SSL Certificate</label></div></div>
    <div class="col-12 d-flex gap-2">
      <button type="submit" class="btn fw-btn-primary">Save Changes</button>
      <a href="{{ url_for('appliances.detail', id=appliance.id) }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </div>
</form>
</div></div></div></div>
{% endblock %}
