{% extends 'base.html' %}
{% block title %}Profile - Fortinet Manager{% endblock %}
{% block content %}
<div class="fw-page-header"><h4>My Profile</h4></div>
<div class="row"><div class="col-md-6">
<div class="card shadow-sm">
<div class="card-header fw-card-header">Change Password</div>
<div class="card-body">
<form method="post" action="{{ url_for('auth.profile') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Current Password</label>
    <input type="password" name="current_password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">New Password</label>
    <input type="password" name="new_password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Confirm New Password</label>
    <input type="password" name="confirm_password" class="form-control" required></div>
  <button type="submit" class="btn fw-btn-primary">Update Password</button>
</form>
</div></div>
<div class="mt-3 text-muted small">Username: <strong>{{ current_user.username }}</strong> &mdash; Role: <strong>{{ current_user.role }}</strong></div>
</div></div>
{% endblock %}
