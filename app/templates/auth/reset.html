<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Choose a New Password — SATOM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fortiweb.css') }}">
  <link rel="icon" href="{{ theme_favicon_url or url_for('static', filename='img/favicon.svg') }}">
  {% if theme_css %}<style nonce="{{ csp_nonce }}">{{ theme_css }}</style>{% endif %}
  <style nonce="{{ csp_nonce }}">
    body{background:var(--fw-sidebar-bg);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:var(--fw-font);}
    .login-wrapper{width:100%;max-width:420px;padding:20px;}
    .login-card{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
    .login-header{background:var(--fw-topbar-bg);padding:32px;text-align:center;}
    .login-logo{width:64px;height:64px;background:var(--fw-accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 16px;}
    .login-brand-text{color:#fff;font-size:20px;font-weight:700;margin:0 0 4px;}
    .login-body{padding:32px;}
    .btn-login{background:var(--fw-accent);border-color:var(--fw-accent);color:#fff;font-weight:600;padding:10px;border-radius:6px;width:100%;}
    .btn-login:hover{background:var(--fw-accent-hover);color:#fff;}
    .alert-login{border:none;border-left:4px solid var(--fw-danger);background:rgba(220,53,69,.06);color:#9B1C2A;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:20px;}
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"><i class="bi bi-shield-lock"></i></div>
      <p class="login-brand-text">Choose a new password</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}{% for category, message in messages %}
          <div class="alert-login"><i class="bi bi-exclamation-triangle-fill me-1"></i>{{ message }}</div>
        {% endfor %}{% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="new_password" class="form-label">New password</label>
          <input type="password" class="form-control" id="new_password" name="new_password"
                 placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
        <div class="mb-4">
          <label for="confirm_password" class="form-label">Confirm new password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                 placeholder="Repeat new password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-login"><i class="bi bi-check-lg me-1"></i>Set new password</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" style="font-size:13px;"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
