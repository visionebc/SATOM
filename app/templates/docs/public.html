<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — OFortMAut</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fortiweb.css') }}">

  <style nonce="{{ csp_nonce }}">
    body { background:#1D3452; margin:0; font-family:var(--fw-font); color:#1f2d3d; }
    .doc-topbar {
      background:#162940; color:#fff; padding:14px 24px;
      display:flex; align-items:center; justify-content:space-between;
      box-shadow:0 2px 12px rgba(0,0,0,.25);
    }
    .doc-topbar .brand { display:flex; align-items:center; gap:12px; font-weight:600; }
    .doc-topbar .brand .logo {
      width:34px; height:34px; background:var(--fw-accent); border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff;
    }
    .doc-topbar a.back { color:rgba(255,255,255,.85); text-decoration:none; font-size:14px; }
    .doc-topbar a.back:hover { color:#fff; }
    .doc-shell { max-width:920px; margin:28px auto 60px; padding:0 20px; }
    .doc-card {
      background:#fff; border-radius:12px; padding:36px 44px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .doc-card h1 { font-size:28px; font-weight:700; margin-top:0; }
    .doc-card h2 { font-size:21px; font-weight:600; margin-top:34px; border-bottom:1px solid #e3e8ee; padding-bottom:8px; }
    .doc-card h3 { font-size:16px; font-weight:600; margin-top:24px; }
    .doc-card table { width:100%; border-collapse:collapse; margin:14px 0; font-size:14px; }
    .doc-card th, .doc-card td { border:1px solid #e3e8ee; padding:8px 10px; text-align:left; vertical-align:top; }
    .doc-card th { background:#f5f7fa; }
    .doc-card pre {
      background:#0f1b2d; color:#e6edf3; padding:14px 16px; border-radius:8px;
      overflow-x:auto; font-size:13px;
    }
    .doc-card code { font-size:13px; }
    .doc-card :not(pre) > code { background:#eef1f5; color:#b5265d; padding:1px 5px; border-radius:4px; }
    .doc-card blockquote {
      border-left:4px solid var(--fw-accent); background:#f5f7fa;
      margin:16px 0; padding:10px 16px; color:#3a4a5d;
    }
    .doc-footer { text-align:center; color:rgba(255,255,255,.4); font-size:11.5px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="doc-topbar">
    <div class="brand"><span class="logo">FM</span><span>OFortMAut</span></div>
    <a class="back" href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a>
  </div>

  <div class="doc-shell">
    <article class="doc-card">
      {{ content }}
    </article>
    <p class="doc-footer">&copy; 2026 OFortMAut &mdash; Public API documentation</p>
  </div>
</body>
</html>
