<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _('Not found') }}</title>
<style nonce="{{ csp_nonce }}">
  /* Standalone page: it has to render when the stylesheet cannot be served,
     so the SATOM palette is inlined literally rather than via var(--fw-*).
     Values copied from :root in static/css/fortiweb.css. Light theme only
     (safeguards Sec. 9m) -- this page used to ship the fleet's dark
     glassmorphism theme, which is not this product's theme. */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,'Helvetica Neue',Arial,sans-serif;
       background:#F3F6FC;color:#0C1B33;padding:2rem}
  .card{max-width:520px;width:100%;text-align:center;padding:2.75rem 2.5rem;
        background:#FFFFFF;border:1px solid #DCE4F3;border-radius:8px;
        box-shadow:0 1px 2px rgba(16,32,52,0.06),0 3px 12px rgba(16,32,52,0.06)}
  .glyph{font-size:3rem;line-height:1}
  h1{margin:.6rem 0 .4rem;font-size:1.6rem;font-weight:700;color:#0C1B33}
  p{color:#51607F;margin:.4rem 0}
  a.home{display:inline-block;margin-top:1.1rem;padding:.6rem 1.4rem;border-radius:4px;color:#FFFFFF;
         text-decoration:none;font-weight:600;background:#0A3F9F}
  a.home:hover{background:#041F5A;color:#FFFFFF}
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">🧭</div>
    <h1>{{ _('Page not found') }}</h1>
    <p>{{ _('The page you are looking for doesn\'t exist or has moved.') }}</p>
    <a class="home" href="/">{{ _('Return home') }}</a>
  </div>
</body>
</html>
