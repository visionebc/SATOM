<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error{% if error_id %} · {{ error_id }}{% endif %}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
       background:#080d1a;color:#e2e8f0;padding:2rem}
  .card{max-width:560px;width:100%;text-align:center;padding:2.75rem 2.5rem;
        background:rgba(15,23,42,0.6);border:1px solid rgba(148,163,184,0.10);border-radius:18px}
  .glyph{font-size:3rem;line-height:1}
  h1{margin:.6rem 0 .4rem;font-size:1.6rem;font-weight:700}
  p{color:#94a3b8;margin:.4rem 0}
  .ref{margin:1.5rem 0 1rem}
  .ref .lbl{color:#64748b;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem}
  code{font-size:1.35rem;letter-spacing:.12em;color:#fbbf24;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .copy{margin-left:.5rem;background:rgba(148,163,184,0.12);border:1px solid rgba(148,163,184,0.18);
        color:#94a3b8;border-radius:8px;padding:.25rem .55rem;cursor:pointer;font-size:.85rem}
  .hint{color:#64748b;font-size:.83rem}
  a.home{display:inline-block;margin-top:1.1rem;padding:.6rem 1.4rem;border-radius:11px;color:#fff;
         text-decoration:none;font-weight:600;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">⚠️</div>
    <h1>Something went wrong</h1>
    <p>An unexpected error occurred while processing your request. The problem has been logged.</p>
    {% if error_id %}
    <div class="ref">
      <div class="lbl">Error reference</div>
      <code id="fw-err-id">{{ error_id }}</code>
      <button type="button" class="copy"
              onclick="navigator.clipboard&&navigator.clipboard.writeText('{{ error_id }}');this.textContent='✓'">Copy</button>
    </div>
    <p class="hint">Share this reference with your administrator so they can locate the exact problem in the logs.</p>
    {% endif %}
    <a class="home" href="/">Return home</a>
  </div>
</body>
</html>
