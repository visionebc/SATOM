<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Choose a product &middot; SATOM</title>
  <link rel="icon" href="{{ theme_favicon_url or url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fortiweb.css') }}">
  <style nonce="{{ csp_nonce }}">
    :root { --ps-ease: cubic-bezier(0.16, 1, 0.3, 1); }
    * { box-sizing: border-box; }
    .ps-backdrop {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(48,127,226,0.18), transparent 60%),
        linear-gradient(160deg, #0e1a2b 0%, #14233a 100%);
      animation: psFade .15s ease both;
    }
    @keyframes psFade { from { opacity: 0; } to { opacity: 1; } }

    /* Notion-style frosted modal */
    .ps-modal {
      width: 100%; max-width: min(1180px, 96vw);
      background: rgba(22, 32, 50, 0.55);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 28px 24px 20px;
      animation: psPop .22s var(--ps-ease) both;
    }
    @keyframes psPop {
      from { opacity: 0; transform: translateY(14px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ps-head { display: flex; align-items: center; gap: 18px; text-align: left; margin-bottom: 22px; }
    .ps-head img { width: auto; height: 56px; margin-bottom: 0; opacity: .95; flex-shrink: 0; }
    .ps-head-text { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; flex: 1; }
    .ps-head h1 { font-size: 18px; font-weight: 600; color: #f3f6fb; margin: 0; letter-spacing: -0.2px; }
    .ps-head p { color: #93a6bd; margin: 4px 0 0; font-size: 12.5px; }
    .ps-head p.ps-full { color: #cdd9e7; font-size: 13px; font-weight: 500; margin-top: 5px; letter-spacing: .2px; }
    .ps-env {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 10px; padding: 3px 12px; border-radius: 999px;
      font-size: 10.5px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase;
    }
    .ps-env-dot { width: 7px; height: 7px; border-radius: 50%; }
    .ps-env.prod { color: #ffb4b4; background: rgba(239,68,68,.14); border: 1px solid rgba(239,68,68,.6); }
    .ps-env.prod .ps-env-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .ps-env.dev { color: #ffd79a; background: rgba(245,158,11,.14); border: 1px solid rgba(245,158,11,.6); }
    .ps-env.dev .ps-env-dot { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    /* Every ADOM on ONE row. The modal width above is what makes this
       possible: with 5 cards, 170px columns needed ~950px of content box
       and the old 820px cap silently wrapped the last one. */
    .ps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 14px; }
    .ps-form { margin: 0; display: flex; }

    .ps-card {
      width: 100%;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 10px; cursor: pointer;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 22px 16px 18px; color: #e7edf5;
      transition: background .18s var(--ps-ease), border-color .18s var(--ps-ease), transform .18s var(--ps-ease);
      opacity: 0; animation: psRow .34s var(--ps-ease) forwards;
    }
    .ps-form:nth-child(1) .ps-card { animation-delay: .04s; }
    .ps-form:nth-child(2) .ps-card { animation-delay: .09s; }
    .ps-form:nth-child(3) .ps-card { animation-delay: .14s; }
    .ps-form:nth-child(4) .ps-card { animation-delay: .19s; }
    .ps-form:nth-child(5) .ps-card { animation-delay: .24s; }
    .ps-form:nth-child(6) .ps-card { animation-delay: .29s; }
    .ps-form:nth-child(7) .ps-card { animation-delay: .34s; }
    @keyframes psRow { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .ps-card:hover { background: rgba(48, 127, 226, 0.14); border-color: rgba(48, 127, 226, 0.55); transform: translateY(-2px); }
    .ps-card:active { transform: translateY(0) scale(.995); }

    .ps-ico {
      width: 54px; height: 54px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.92); border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .ps-ico img { width: 34px; height: 34px; }

    .ps-name { font-size: 15px; font-weight: 600; color: #f3f6fb; line-height: 1.2; }
    .ps-desc { font-size: 12px; color: #9fb1c7; line-height: 1.45; }

    .ps-go {
      /* auto pushes it to the bottom of the flex card, so the call to
         action lines up across cards whose descriptions differ in length. */
      margin-top: auto; padding-top: 4px; font-size: 12px; font-weight: 600; color: #6fb0ff;
      display: inline-flex; align-items: center; gap: 5px;
      opacity: .85; transition: gap .18s var(--ps-ease), opacity .18s;
    }
    .ps-card:hover .ps-go { gap: 9px; opacity: 1; }

    .ps-foot { margin-top: 20px; text-align: center; font-size: 11px; color: #6c819a; }
    .ps-foot a { color: #8ea2ba; text-decoration: none; }
    .ps-foot a:hover { color: #cdd9e7; text-decoration: underline; }

    /* Between ~820px and ~1020px there is still room for one row, but only
       with a tighter card. Shrinking here beats wrapping: a card that fell
       to a second row is the thing this layout exists to avoid. */
    @media (max-width: 1020px) {
      .ps-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
      .ps-card { padding: 16px 10px 14px; gap: 8px; }
      .ps-ico { width: 44px; height: 44px; }
      .ps-ico img { width: 28px; height: 28px; }
      .ps-name { font-size: 13.5px; }
      .ps-desc { font-size: 11px; line-height: 1.4; }
    }
    /* Below this a five-wide row would be unreadable, not merely tight. */
    @media (max-width: 820px) { .ps-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .ps-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      .ps-backdrop, .ps-modal, .ps-card { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="ps-backdrop">
    <div class="ps-modal" role="dialog" aria-modal="true" aria-label="Select a product">
      <div class="ps-head">
        <img src="{{ theme_logo_url or url_for('static', filename='img/satom-mark.png') }}" alt="SATOM">
        <div class="ps-head-text">
        {% set _is_prod = env_mode == 'production' %}
        <span class="ps-env {{ 'prod' if _is_prod else 'dev' }}">
          <i class="ps-env-dot"></i>{{ 'PRODUCTION' if _is_prod else 'DEVELOPMENT' }}
        </span>
        <h1>SATOM</h1>
        <p class="ps-full">System Automation & Task Orchestration Manager</p>
        <p>Select the product you want to manage</p>
        </div>
      </div>

      <div class="ps-grid">
        {% for key, p in products.items() %}
        <form class="ps-form" method="post" action="{{ url_for('product.set_product') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="product" value="{{ key }}">
          <button type="submit" class="ps-card">
            <span class="ps-ico"><img src="{{ url_for('static', filename=p.mark) }}" alt="{{ p.name }}"></span>
            <span class="ps-name">{{ p.name }}</span>
            <span class="ps-desc">{{ p.description }}</span>
            <span class="ps-go">Open &rarr;</span>
          </button>
        </form>
        {% endfor %}
      </div>

      <div class="ps-foot">
        {{ current_user.username }} &middot;
        <a href="{{ url_for('auth.logout') }}">Sign out</a>
      </div>
    </div>
  </div>
  <script nonce="{{ csp_nonce }}">
    // The product gate IS an explicit ADOM switch. This page has no bundled
    // JS, so update the per-tab ADOM truth (sessionStorage.fmAdom) here — else
    // the destination page realigns to the stale ADOM (wrong banner + an extra
    // navigation). See turbo-boot.js "Per-tab ADOM".
    (function () {
      var forms = document.querySelectorAll('form.ps-form');
      for (var i = 0; i < forms.length; i++) {
        forms[i].addEventListener('submit', function (ev) {
          try {
            var inp = ev.currentTarget.querySelector('input[name="product"]');
            if (inp && inp.value) sessionStorage.setItem('fmAdom', inp.value);
          } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
