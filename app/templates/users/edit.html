{% extends "base.html" %}
{% block title %}Edit User — {{ user.username }}{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('users.index') }}">Users</a></li>
    <li class="breadcrumb-item active">Edit {{ user.username }}</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><strong>Edit User</strong></div>
      <div class="card-body">
        <form method="post" action="{{ url_for('users.edit_save', id=user.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" value="{{ user.username }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Profile</label>
            <select name="profile_id" class="form-select">
              {% for p in profiles %}
              <option value="{{ p.id }}" {% if user.profile_id == p.id %}selected{% endif %}>
                {{ p.name }}{% if p.is_system %} — system{% endif %}
              </option>
              {% endfor %}
            </select>
            <div class="text-muted" style="font-size:12px;">
              The profile defines exactly what this user can do.
              <a href="{{ url_for('profiles.index') }}">Manage profiles</a>.
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('users.index') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
