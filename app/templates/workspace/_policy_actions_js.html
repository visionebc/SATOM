{# Script half of _policy_actions.html. Exposes SatomPolicyActions.open(action,
   [policy names]); a ?act=<action>&policy=<name> deep link opens it on load. #}
<script nonce="{{ csp_nonce }}">
(function () {
  var hasOtherFw = {{ 'true' if other_appliances else 'false' }};
  var previewUrl = "{{ url_for('workspace.policy_action_preview', appliance_id=appliance.id) if appliance else '' }}";
  var applyUrl   = "{{ url_for('workspace.policy_action', appliance_id=appliance.id) if appliance else '' }}";
  var checklistUrl = "{{ url_for('workspace.policy_action_checklist', appliance_id=appliance.id) if appliance else '' }}";
  var CLONE_ACTIONS = { clone_here: 1, clone_to: 1, migrate_to: 1 };
  var ADMIN_COPY_WPP = {{ 'true' if clone_cfg.copy_wpp_default else 'false' }};
  var SRC_APPL_NAME = {{ (appliance.name if appliance else '')|tojson }};

  var LABELS = {
    enable: 'Enable', disable: 'Disable', delete: 'Delete',
    clone_here: 'Clone (same box)', clone_to: 'Clone to another FortiWeb',
    migrate_to: 'Migrate to another FortiWeb'
  };
  var NEEDS_DEST = { clone_to: 1, migrate_to: 1 };
  // The reasons services.policy_graph._skip_reason emits for kept objects.
  var SKIP_REASON_LABELS = {
    'wpp-subtree': 'Web Protection Profile (never auto-deleted)',
    'certificate': 'certificate (never auto-deleted)',
    'ssl-ciphers': 'SSL cipher group (never auto-deleted)',
    'service': 'service (never auto-deleted)',
    'system-object': 'system object (never auto-deleted)'
  };

  // ── Action modal ────────────────────────────────────────────────────────────
  var modalEl = document.getElementById('actionModal');
  var modal = modalEl ? bootstrap.Modal.getOrCreateInstance(modalEl) : null;
  var current = { action: '', policies: [] };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }

  // Deep link from the FortiWeb Server Policy list: ?act=<action>&policy=<name>
  // opens that action's dialog for that policy (same preview / apply path).
  setTimeout(function () {
    try {
      var qp = new URLSearchParams(window.location.search);
      var act = qp.get('act'), pol = qp.get('policy');
      if (act && pol && LABELS[act]) openAction(act, [pol]);
    } catch (e) { /* an old browser only loses the shortcut */ }
  }, 0);

  function openAction(action, policies) {
    if (!modal || !policies.length) return;
    if (NEEDS_DEST[action] && !hasOtherFw) { alert('No other FortiWeb is registered as a destination.'); return; }
    current = { action: action, policies: policies };
    var many = policies.length !== 1;
    document.getElementById('actionModalTitle').textContent = LABELS[action] + ' — ' + policies.length + ' polic' + (many ? 'ies' : 'y');
    var intro = { enable: 'Enable the selected server polic{y}.',
      disable: 'Disable the selected server polic{y} (traffic stops; the object is kept).',
      delete: 'DELETE the selected server polic{y}. Objects used only by this policy (virtual server, VIP, server pool…) are deleted with it; Web Protection Profiles, certificates, services and objects shared with other policies are kept. The preview lists both.',
      clone_here: 'Deep-clone the whole policy tree on THIS FortiWeb under a new name. Existing objects are validated (not overwritten); the copy is left DISABLED.',
      clone_to: 'Deep-clone the whole policy tree onto ANOTHER FortiWeb. Existing objects on the destination are validated (not overwritten); the copy is left DISABLED.',
      migrate_to: 'Clone the policy tree onto another FortiWeb and, only if that lands cleanly, DISABLE the source (the source is kept — never deleted).'
    }[action] || '';
    document.getElementById('actionModalIntro').textContent = intro.replace('{y}', many ? 'ies' : 'y');
    document.getElementById('actionTargets').innerHTML =
      '<div class="fw-badge fw-badge-secondary mb-1">Targets</div><br>' +
      policies.map(function (p) { return '<span class="fw-badge fw-badge-info">' + esc(p) + '</span>'; }).join(' ');
    document.getElementById('actionFieldDest').classList.toggle('d-none', !NEEDS_DEST[action]);
    var isClone = !!CLONE_ACTIONS[action];
    var single = policies.length === 1;
    // Every single-policy clone/migrate asks for the NEW NAME (and the IP below);
    // clone-to/migrate-to prefill the original name, clone-here needs a distinct one.
    var showName = (isClone && single);
    var nameField = document.getElementById('actionFieldName');
    nameField.classList.toggle('d-none', !showName);
    if (showName) document.getElementById('actionNewName').value =
      (action === 'clone_here') ? (policies[0] + '-copy') : policies[0];
    // VIP IP: asked on a single clone/migrate; bulk auto-assigns dummy IPs.
    document.getElementById('actionFieldVip').classList.toggle('d-none', !(isClone && single));
    document.getElementById('actionVipIp').value = '';
    document.getElementById('actionVipHint').textContent = '';
    // Interface re-binding: cross-box only, and only once the checklist has
    // told us which ports the tree actually binds. Reset here so a second
    // dialog never inherits the previous policy's mapping.
    ifaceState = { rows: [], dest: [], chosen: {} };
    document.getElementById('actionFieldIface').classList.add('d-none');
    document.getElementById('actionIfaceBody').innerHTML = '';
    document.getElementById('actionIfaceHint').textContent = '';
    // Artifact acknowledgement resets with the dialog. Carrying it over would
    // let a tick made for ONE policy's missing schema silently authorise a
    // different policy's — the acceptance is per run, not a preference.
    artState = { need: false, accepted: false };
    document.getElementById('actionArtAccept').checked = false;
    document.getElementById('actionFieldArtifacts').classList.add('d-none');
    document.getElementById('actionArtBody').innerHTML = '';
    document.getElementById('actionArtHint').textContent = '';
    // New-field answers reset with the dialog: a value typed for one policy's
    // destination build must never ride into a run against another.
    nfState = { rows: [], chosen: {} };
    document.getElementById('actionFieldNewFields').classList.add('d-none');
    document.getElementById('actionNewFieldsBody').innerHTML = '';
    document.getElementById('actionBulkIpNote').classList.toggle('d-none', !(isClone && !single));
    // WPP options: admin defaults, editable only after "Override admin defaults".
    document.getElementById('actionFieldWppOpts').classList.toggle('d-none', !isClone);
    document.getElementById('actionFieldAdditive').classList.toggle('d-none', !isClone);
    document.getElementById('actionAdditiveOnly').checked = true;
    var copyWpp = document.getElementById('actionCopyWpp');
    copyWpp.checked = ADMIN_COPY_WPP; copyWpp.disabled = true;
    document.getElementById('actionOverrideDefaults').checked = false;
    document.getElementById('actionWppChoice').classList.add('d-none');
    document.getElementById('actionChecklist').classList.toggle('d-none', !isClone);
    document.getElementById('actionChecklistBody').innerHTML = '<span class="text-muted">Running checks…</span>';
    chk.hasBlock = false; chk.previewDone = false;
    document.getElementById('actionPreview').classList.add('d-none');
    document.getElementById('actionPreviewBody').innerHTML = '';
    document.getElementById('actionError').classList.add('d-none');
    updateApply();
    modal.show();
    if (isClone) runChecklist();
  }

  // Source→destination port mapping the operator picked, plus what the last
  // checklist told us about both sides. `chosen` holds ONLY real overrides:
  // an entry equal to the source name is dropped, so "left alone" reaches the
  // server as absent rather than as a rewrite to the same value.
  var ifaceState = { rows: [], dest: [], chosen: {} };

  function renderIfaceMap(sg) {
    var box = document.getElementById('actionFieldIface');
    var rows = (sg && sg.interfaces) || [];
    var dest = (sg && sg.dest_interfaces) || [];
    ifaceState.rows = rows; ifaceState.dest = dest;
    if (!NEEDS_DEST[current.action] || !rows.length) {
      box.classList.add('d-none');
      document.getElementById('actionIfaceBody').innerHTML = '';
      return;
    }
    box.classList.remove('d-none');
    var present = {};
    dest.forEach(function (d) { present[d.name] = d; });
    var html = rows.map(function (r) {
      var target = ifaceState.chosen[r.source] || r.target || r.source;
      // The destination list is what the device reported. When it could not be
      // read there is nothing to offer, so the current value is shown as the
      // only option rather than an empty select that looks like a choice.
      var opts;
      if (dest.length) {
        opts = dest.map(function (d) {
          return '<option value="' + esc(d.name) + '"' + (d.name === target ? ' selected' : '') + '>'
            + esc(d.name) + (d.ip ? ' — ' + esc(d.ip) : '')
            + ' · ' + esc(d.role_label || 'Not declared') + '</option>';
        }).join('');
      } else {
        opts = '<option value="' + esc(target) + '" selected>' + esc(target)
          + ' (destination not readable)</option>';
      }
      var warn = (dest.length && !present[target])
        ? '<div style="font-size:11.5px;"><span class="fw-badge fw-badge-danger">missing</span></div>' : '';
      return '<tr><td class="font-monospace">' + esc(r.source)
        + '<div class="text-muted" style="font-size:11.5px;">' + esc(r.source_role_label || 'Not declared')
        + (r.source_segment ? ' · ' + esc(r.source_segment) : '') + '</div></td>'
        + '<td class="text-muted" style="font-size:12px;">' + esc((r.fields || []).join(', ')) + '</td>'
        + '<td><select class="form-select form-select-sm fw-iface-sel" data-src="' + esc(r.source) + '">'
        + opts + '</select>' + warn + '</td></tr>';
    }).join('');
    document.getElementById('actionIfaceBody').innerHTML = html;
    document.getElementById('actionIfaceHint').textContent = dest.length
      ? 'Ports read live from the destination. The role next to each name is what an operator DECLARED on that device — a matching port name alone does not prove it is the same network.'
      : 'The destination did not answer system/interface, so nothing could be verified. That is "not measured", not "fine".';
  }

  // Changing a target re-runs the checklist: the gate's verdict depends on the
  // chosen port, so a stale verdict next to a new choice would be a checklist
  // that describes a different operation than the one Apply would perform.
  document.getElementById('actionIfaceBody').addEventListener('change', function (e) {
    var sel = e.target.closest('.fw-iface-sel');
    if (!sel) return;
    var src = sel.dataset.src, val = sel.value;
    if (!val || val === src) delete ifaceState.chosen[src];
    else ifaceState.chosen[src] = val;
    chk.previewDone = false;
    document.getElementById('actionPreview').classList.add('d-none');
    updateApply();
    runChecklist();
  });

  // Whether the run needs the operator to accept skipping file content, and
  // whether they did. `need` comes from the SERVER's checklist every time.
  var artState = { need: false, accepted: false };

  function renderArtifacts(rows, need) {
    var box = document.getElementById('actionFieldArtifacts');
    rows = rows || [];
    if (!rows.length) {
      box.classList.add('d-none');
      document.getElementById('actionArtBody').innerHTML = '';
      return;
    }
    box.classList.remove('d-none');
    document.getElementById('actionArtBody').innerHTML = rows.map(function (r) {
      var badge, detail;
      if (r.status !== 'create') {
        badge = '<span class="fw-badge fw-badge-secondary">on destination</span>';
        detail = 'not copied — the destination keeps its own content';
      } else if (r.resolved) {
        badge = '<span class="fw-badge fw-badge-success">will be copied</span>';
        detail = r.origin + (r.size ? ' · ' + r.size + ' bytes' : '');
      } else {
        badge = '<span class="fw-badge fw-badge-danger">no content</span>';
        detail = r.reason || 'SATOM holds no copy';
      }
      return '<tr><td class="font-monospace">' + esc(r.name)
        + (r.name_warning ? '<div style="font-size:11.5px;color:#7A5700;">'
             + esc(r.name_warning) + '</div>' : '')
        + '</td><td style="font-size:12px;">' + esc(r.label)
        + (r.readable ? '' : '<div class="text-muted" style="font-size:11.5px;">not readable from any FortiWeb</div>')
        + '</td><td>' + badge
        + '<div class="text-muted" style="font-size:11.5px;">' + esc(detail) + '</div></td></tr>';
    }).join('');
    artState.need = !!need;
    document.getElementById('actionArtAckBox').classList.toggle('d-none', !need);
    document.getElementById('actionArtHint').textContent = need
      ? 'FortiWeb stores only the NAME of these objects — their bytes are not in the configuration and three of the seven types cannot be read back from any device. Upload the file under Artifacts to clone it properly.'
      : 'Content resolved for every file-backed object in this tree.';
  }

  // Accepting re-runs the checklist so the row the operator is looking at is
  // the one the server produced WITH the acknowledgement, not a client-side
  // recolouring of the previous verdict.
  document.getElementById('actionArtAccept').addEventListener('change', function (e) {
    artState.accepted = !!e.target.checked;
    chk.previewDone = false;
    document.getElementById('actionPreview').classList.add('d-none');
    updateApply();
    runChecklist();
  });

  // The destination build's NEW fields (server-computed offer) and the values
  // the operator typed. `chosen` holds ONLY non-empty answers, keyed
  // "object|field": blank means "leave unset" and never reaches the server.
  var nfState = { rows: [], chosen: {} };
  function escAttr(s) {
    return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderNewFields(rows) {
    var box = document.getElementById('actionFieldNewFields');
    rows = rows || [];
    nfState.rows = rows;
    // Answers for fields the latest checklist no longer offers are dropped:
    // sending them would only earn a refusal from the engine.
    var live = {};
    rows.forEach(function (r) { live[r.key + '|' + r.field] = 1; });
    Object.keys(nfState.chosen).forEach(function (k) { if (!live[k]) delete nfState.chosen[k]; });
    if (!rows.length) { box.classList.add('d-none'); document.getElementById('actionNewFieldsBody').innerHTML = ''; return; }
    box.classList.remove('d-none');
    document.getElementById('actionNewFieldsBody').innerHTML = rows.map(function (r) {
      var k = r.key + '|' + r.field, cur = nfState.chosen[k] || '';
      var ev = r.claim === 'vendor'
        ? '<span class="fw-badge fw-badge-warning" title="' + escAttr('Only the vendor\'s documentation says ' + (r.target_version || 'the destination') + ' serves this field; no box running it was measured.') + '">vendor claims</span>'
        : '<span class="fw-badge fw-badge-info" title="' + escAttr('Measured: ' + (r.sources || []).join(', ')) + '">measured</span>';
      var typ = (r.type || 'text') + (r.default !== null && r.default !== undefined && r.default !== '' ? ' · default ' + r.default : '');
      var input;
      var opts = r.options || [];
      if (!r.settable) {
        input = '<span class="text-muted" style="font-size:11.5px;">sub-table — set it on the destination after the copy</span>';
      } else if (opts.length || r.type === 'bool') {
        if (!opts.length) opts = ['enable', 'disable'];
        input = '<select class="form-select form-select-sm fw-nf-input" data-k="' + escAttr(k) + '">'
          + '<option value="">— leave unset —</option>'
          + opts.map(function (o) { return '<option value="' + escAttr(o) + '"' + (String(o) === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('')
          + '</select>';
      } else {
        input = '<input type="text" class="form-control form-control-sm fw-nf-input" data-k="' + escAttr(k)
          + '" value="' + escAttr(cur) + '" placeholder="leave unset" autocomplete="off" maxlength="1024">';
      }
      var ren = r.renamed_from
        ? '<div style="font-size:11.5px;color:#7A5700;">renamed from <code>' + esc(r.renamed_from) + '</code>'
          + (r.source_value !== undefined ? ' — source value <code>' + esc(r.source_value) + '</code>' : '') + '</div>' : '';
      return '<tr><td class="font-monospace" style="font-size:12px;">' + esc(r.key)
        + (r.objects > 1 ? ' <span class="text-muted">×' + r.objects + '</span>' : '') + '</td>'
        + '<td class="font-monospace" style="font-size:12px;">' + esc(r.field) + ren
        + '<div class="text-muted" style="font-size:11.5px;">' + esc(typ) + '</div></td>'
        + '<td>' + ev + '</td><td style="min-width:180px;">' + input + '</td></tr>';
    }).join('');
  }

  // A value typed or picked changes what Apply would write, so the preview on
  // screen no longer describes it: invalidate, exactly like the other knobs.
  document.getElementById('actionNewFieldsBody').addEventListener('change', function (e) {
    var el = e.target.closest('.fw-nf-input');
    if (!el) return;
    var v = (el.value || '').trim();
    if (v) nfState.chosen[el.dataset.k] = v; else delete nfState.chosen[el.dataset.k];
    chk.previewDone = false;
    document.getElementById('actionPreview').classList.add('d-none');
    updateApply();
  });

  function newFieldValues() {
    var out = {}, n = 0;
    Object.keys(nfState.chosen).forEach(function (k) {
      var i = k.indexOf('|'), key = k.slice(0, i), field = k.slice(i + 1);
      if (!nfState.chosen[k]) return;
      (out[key] = out[key] || {})[field] = nfState.chosen[k]; n++;
    });
    return n ? out : null;
  }

  function ifaceMapValue() {
    var out = {};
    Object.keys(ifaceState.chosen).forEach(function (k) {
      if (ifaceState.chosen[k] && ifaceState.chosen[k] !== k) out[k] = ifaceState.chosen[k];
    });
    return out;
  }

  function wppChoiceValue() {
    var box = document.getElementById('actionWppChoice');
    if (box.classList.contains('d-none')) return '';
    var sel = document.querySelector('input[name="wppChoice"]:checked');
    return sel ? sel.value : '';
  }

  function collectPayload() {
    var p = { action: current.action, policies: current.policies };
    if (NEEDS_DEST[current.action]) p.dest_id = document.getElementById('actionDest').value;
    var nameField = document.getElementById('actionFieldName');
    if (!nameField.classList.contains('d-none')) p.new_name = document.getElementById('actionNewName').value.trim();
    if (CLONE_ACTIONS[current.action]) {
      var single = current.policies.length === 1;
      if (single) p.vip_ip = document.getElementById('actionVipIp').value.trim();
      if (NEEDS_DEST[current.action]) p.iface_map = ifaceMapValue();
      p.accept_missing_artifacts = !!artState.accepted;
      var nfv = newFieldValues();
      if (nfv) p.new_field_values = nfv;
      p.additive_only = document.getElementById('actionAdditiveOnly').checked;
      var choice = wppChoiceValue();
      if (choice === 'use_dest') {
        p.copy_wpp = false;
      } else {
        p.copy_wpp = document.getElementById('actionCopyWpp').checked;
        if (choice === 'new' && p.copy_wpp) {
          var v = document.getElementById('actionWppNewName').value.trim();
          if (single) p.wpp_new_name = v; else p.wpp_suffix = v;
        }
      }
    }
    return p;
  }

  var chk = { hasBlock: false, previewDone: false };
  function updateApply() {
    // An un-acknowledged missing artifact disables Apply exactly like a block
    // does, even though the CHECK is a warn. The difference is deliberate: the
    // operator can clear it by ticking the box, which a block can never be.
    var needsAck = artState.need && !artState.accepted;
    document.getElementById('actionApplyBtn').disabled =
      !(chk.previewDone && !chk.hasBlock && !needsAck);
  }

  function renderChecklist(data) {
    var LV = { ok: ['#10b981', 'bi-check-circle'], warn: ['#fbbf24', 'bi-exclamation-triangle'],
               choice: ['#fbbf24', 'bi-signpost-split'], block: ['#ef4444', 'bi-x-octagon'] };
    var hasBlock = false, wppDiff = null, ifaceSuggest = null, html = '';
    // Merged across every selected policy, like the interface map: two
    // policies can share one schema file, and showing it twice would invite
    // two separate decisions about one object.
    var artRows = [], artSeen = {}, artNeed = false;
    // New-field offers, merged across the selected policies by object+field:
    // one answer per field of one object type, whichever policy offered it.
    var nfRows = [], nfSeen = {};
    (data.policies || []).forEach(function (pr) {
      html += '<div style="margin:6px 0 2px;"><strong>' + esc(pr.policy) + '</strong></div>';
      (pr.checks || []).forEach(function (c) {
        var lv = LV[c.level] || LV.warn;
        if (c.level === 'block') hasBlock = true;
        html += '<div class="d-flex" style="gap:6px;align-items:baseline;">'
          + '<i class="bi ' + lv[1] + '" style="color:' + lv[0] + ';"></i>'
          + '<div><span>' + esc(c.label) + '</span>'
          + (c.detail ? ' <span class="text-muted">— ' + esc(c.detail) + '</span>' : '')
          + '</div></div>';
      });
      var sg = pr.suggest || {};
      if (sg.wpp_status === 'different' && !wppDiff) wppDiff = sg;
      // MERGED across every selected policy, not taken from the first one:
      // a source→destination port mapping is a property of the two chassis,
      // so it applies to the whole run — and a bulk run whose second policy
      // binds a port the first does not would otherwise offer no control over
      // that port while still rewriting nothing for it.
      if (!ifaceSuggest) ifaceSuggest = { interfaces: [], dest_interfaces: [] };
      if ((sg.dest_interfaces || []).length && !ifaceSuggest.dest_interfaces.length)
        ifaceSuggest.dest_interfaces = sg.dest_interfaces;
      (sg.interfaces || []).forEach(function (r) {
        var prev = ifaceSuggest.interfaces.filter(function (x) { return x.source === r.source; })[0];
        if (!prev) { ifaceSuggest.interfaces.push(Object.assign({}, r, { fields: (r.fields || []).slice() })); return; }
        (r.fields || []).forEach(function (f) { if (prev.fields.indexOf(f) < 0) prev.fields.push(f); });
      });
      (sg.new_fields_offer || []).forEach(function (r) {
        var k = r.key + '|' + r.field;
        if (!nfSeen[k]) { nfSeen[k] = Object.assign({}, r); nfRows.push(nfSeen[k]); return; }
        nfSeen[k].objects = (nfSeen[k].objects || 0) + (r.objects || 0);
      });
      if (sg.artifacts_need_ack) artNeed = true;
      (sg.artifacts || []).forEach(function (r) {
        var k = r.kind + '␀' + r.name;
        // "create" wins over an already-present duplicate: if ANY selected
        // policy still needs the object created, the row must show that.
        if (!artSeen[k]) { artSeen[k] = r; artRows.push(r); return; }
        if (r.status === 'create' && artSeen[k].status !== 'create') {
          artRows[artRows.indexOf(artSeen[k])] = r; artSeen[k] = r;
        }
      });
    });
    renderIfaceMap(ifaceSuggest);
    renderArtifacts(artRows, artNeed);
    renderNewFields(nfRows);
    document.getElementById('actionChecklistBody').innerHTML = html || '<span class="text-muted">No checks.</span>';
    chk.hasBlock = hasBlock;
    // Prefill the VIP suggestion (single) from the admin dummy-IP rules.
    var single = current.policies.length === 1;
    if (single && data.policies && data.policies.length === 1) {
      var s = data.policies[0].suggest || {};
      var ipEl = document.getElementById('actionVipIp');
      if (!ipEl.value && s.vip_ip) ipEl.value = s.vip_ip;
      document.getElementById('actionVipHint').textContent =
        (s.source_vip_ip ? ('Source VIP: ' + s.source_vip_ip + ' · ') : '')
        + 'Suggested by admin rules: ' + (s.vip_ip || '—') + ' — edit if needed.';
    }
    // WPP differs on the destination → surface the operator's choice.
    var box = document.getElementById('actionWppChoice');
    if (wppDiff && document.getElementById('actionCopyWpp').checked) {
      box.classList.remove('d-none');
      document.getElementById('actionWppChoiceText').textContent =
        'The destination already has "' + wppDiff.wpp_name + '" but its values DIFFER from the source'
        + (wppDiff.wpp_diff_fields && wppDiff.wpp_diff_fields.length
           ? ' (' + wppDiff.wpp_diff_fields.slice(0, 6).join(', ') + '…)' : '') + '.';
      var nn = document.getElementById('actionWppNewName');
      if (single) {
        nn.value = nn.value || wppDiff.wpp_new_name || (wppDiff.wpp_name + '-' + SRC_APPL_NAME);
        document.getElementById('actionWppNewHint').textContent = 'Full name for the copied profile.';
      } else {
        nn.value = nn.value || ('-' + SRC_APPL_NAME);
        document.getElementById('actionWppNewHint').textContent =
          'SUFFIX appended to each differing profile name (bulk mode).';
      }
    } else {
      box.classList.add('d-none');
    }
    updateApply();
  }

  function runChecklist() {
    if (!CLONE_ACTIONS[current.action]) return;
    document.getElementById('actionChecklistBody').innerHTML = '<span class="text-muted">Running checks…</span>';
    post(checklistUrl, collectPayload()).then(function (d) {
      if (!d.ok) {
        document.getElementById('actionChecklistBody').innerHTML =
          '<span style="color:#fbbf24;">Checks failed: ' + esc(d.error || '?') + '</span>';
        return;
      }
      renderChecklist(d);
    }).catch(function (e) {
      document.getElementById('actionChecklistBody').innerHTML =
        '<span style="color:#fbbf24;">Checks failed: ' + esc('' + e) + '</span>';
    });
  }

  function showErr(msg) {
    var e = document.getElementById('actionError');
    e.textContent = msg; e.classList.remove('d-none');
  }

  function renderPreview(data) {
    var many = data.results.length !== 1;
    document.getElementById('actionPreviewBadge').textContent =
      (data.dest ? ('→ ' + data.dest + ' · ') : '') + data.results.length + ' polic' + (many ? 'ies' : 'y');
    var html = data.results.map(function (r) {
      var head = '<div style="margin:6px 0 2px;"><strong>' + esc(r.policy) + '</strong> — '
        + (r.ok ? '<span style="color:#10b981;">ready</span>'
                : '<span style="color:#fbbf24;">' + esc(r.error || 'check') + '</span>') + '</div>';
      var det = r.detail || {}, body = '';
      if (det.summary) {
        var s = det.summary;
        body += '<div class="text-muted">to create: ' + (s.to_create || 0)
          + ' · already exists: ' + (s.exists || 0) + ' · total: ' + (s.total || 0) + '</div>';
      }
      if (det.new_fields && ((det.new_fields.applied || []).length || (det.new_fields.not_applied || []).length)) {
        var nf = det.new_fields;
        body += '<div style="font-size:12px;margin:2px 0;">'
          + (nf.applied || []).map(function (a) {
              return '<div><span class="fw-badge fw-badge-info">new field</span> ' + esc(a.key + '.' + a.field) + ' on ' + esc(a.mkey) + '</div>';
            }).join('')
          + (nf.not_applied || []).map(function (a) {
              return '<div class="text-muted"><span class="fw-badge fw-badge-secondary">not set</span> ' + esc(a.key + '.' + a.field) + ' — ' + esc(a.reason) + '</div>';
            }).join('') + '</div>';
      }
      if (det.cascade_plan) {
        var cp = det.cascade_plan;
        var cpHtml = '<div style="margin:8px 0 4px;">';
        cpHtml += '<div style="margin-bottom:8px;font-size:12px;">'
          + '<span style="color:#f87171;font-weight:600;">&#10005;&nbsp;' + (det.to_delete_count || 0) + ' will be deleted</span>'
          + '&ensp;&middot;&ensp;'
          + '<span style="color:#94a3b8;">' + (det.to_keep_count || 0) + ' kept (shared/exempt)</span>';
        if (cp.by_parent_count) {
          cpHtml += '&ensp;&middot;&ensp;<span style="color:#94a3b8;">' + cp.by_parent_count + ' auto-removed with parent</span>';
        }
        cpHtml += '</div>';
        if (cp.to_delete && cp.to_delete.length) {
          cpHtml += '<div style="color:#f87171;font-weight:600;font-size:11px;letter-spacing:.04em;margin-bottom:3px;">WILL BE DELETED</div>';
          cpHtml += '<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:6px 8px;margin-bottom:6px;">';
          cpHtml += '<div style="padding:2px 0;"><span style="color:#fca5a5;font-weight:600;">' + esc(cp.root) + '</span>'
            + ' <span style="color:#64748b;font-size:11px;">(server policy)</span></div>';
          cp.to_delete.forEach(function(obj) {
            cpHtml += '<div style="padding:1px 0;padding-left:10px;color:#fca5a5;">&#10005; ' + esc(obj.label || obj.mkey)
              + ' <span style="color:#64748b;font-size:11px;">' + esc(obj.urn) + '</span></div>';
          });
          cpHtml += '</div>';
        }
        if (cp.to_keep && cp.to_keep.length) {
          cpHtml += '<div style="color:#fbbf24;font-weight:600;font-size:11px;letter-spacing:.04em;margin-bottom:3px;">WILL BE KEPT</div>';
          cpHtml += '<div style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:6px;padding:6px 8px;">';
          cp.to_keep.forEach(function(obj) {
            var reasonLabel;
            if (obj.reason === 'shared') {
              var names = obj.shared_with || [];
              reasonLabel = names.length
                ? 'shared with: <span style="color:#cbd5e1;">' + names.map(esc).join(', ') + '</span>'
                : 'shared &mdash; used by other policies';
            } else if (SKIP_REASON_LABELS[obj.reason]) {
              reasonLabel = SKIP_REASON_LABELS[obj.reason];
            } else { reasonLabel = esc(obj.reason || ''); }
            cpHtml += '<div style="padding:1px 0;padding-left:10px;color:#94a3b8;">&#9675; ' + esc(obj.label || obj.mkey)
              + ' <span style="color:#64748b;font-size:11px;">&mdash; ' + reasonLabel + '</span></div>';
          });
          cpHtml += '</div>';
        }
        cpHtml += '</div>';
        body += cpHtml;
      } else if (det.plan) body += '<pre style="white-space:pre-wrap;margin:4px 0;background:rgba(148,163,184,.06);padding:6px;border-radius:6px;">' + esc(det.plan) + '</pre>';
      else if (det.request) body += '<pre style="white-space:pre-wrap;margin:4px 0;background:rgba(148,163,184,.06);padding:6px;border-radius:6px;">' + esc(JSON.stringify(det.request, null, 1)) + '</pre>';
      return head + body;
    }).join('');
    document.getElementById('actionPreviewBody').innerHTML = html || '<span class="text-muted">No changes.</span>';
    document.getElementById('actionPreview').classList.remove('d-none');
  }

  function post(url, payload) {
    return fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; }); });
  }

  document.getElementById('actionPreviewBtn').addEventListener('click', function () {
    document.getElementById('actionError').classList.add('d-none');
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Previewing…';
    post(previewUrl, collectPayload()).then(function (d) {
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-eye me-1"></i>Preview (dry-run)';
      if (!d.ok) { showErr(d.error || 'Preview failed'); return; }
      renderPreview(d);
      chk.previewDone = true;
      updateApply();
    }).catch(function (e) {
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-eye me-1"></i>Preview (dry-run)';
      showErr('' + e);
    });
  });

  document.getElementById('actionApplyBtn').addEventListener('click', function () {
    var action = current.action, n = current.policies.length, many = n !== 1;
    // Confirm removed on request (2026-09-14): Apply is already gated by a mandatory dry-run preview.
    var btn = this; btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Starting…';
    post(applyUrl, collectPayload()).then(function (d) {
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-lightning-charge me-1"></i>Apply for real';
      if (!d.ok || !d.job_id) { showErr(d.error || 'Could not start the action'); return; }
      if (window.JobsUI && window.JobsUI.trackJob) window.JobsUI.trackJob(d.job_id, LABELS[action]);
      if (modal) modal.hide();
    }).catch(function (e) {
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-lightning-charge me-1"></i>Apply for real';
      showErr('' + e);
    });
  });

  // Clone/migrate extras: admin-default override, WPP choice, checklist re-runs.
  document.getElementById('actionOverrideDefaults').addEventListener('change', function () {
    var copyWpp = document.getElementById('actionCopyWpp');
    copyWpp.disabled = !this.checked;
    if (!this.checked) { copyWpp.checked = ADMIN_COPY_WPP; runChecklist(); }
  });
  document.getElementById('actionCopyWpp').addEventListener('change', runChecklist);
  // Flipping the mode INVALIDATES the preview instead of quietly re-labelling
  // it. The plan on screen was classified with the value that was set when
  // Analyse ran; leaving it there while the tick says otherwise would change
  // nothing except what the operator believes the next Apply will do.
  document.getElementById('actionAdditiveOnly').addEventListener('change', function () {
    if (CLONE_ACTIONS[current.action]) { chk.previewDone = false; updateApply(); runChecklist(); }
  });
  document.getElementById('actionDest').addEventListener('change', function () {
    if (CLONE_ACTIONS[current.action]) { chk.previewDone = false; updateApply(); runChecklist(); }
  });
  document.getElementById('actionChecklistBtn').addEventListener('click', runChecklist);
  document.getElementById('actionNewName').addEventListener('change', function () {
    if (CLONE_ACTIONS[current.action]) runChecklist();
  });

  window.SatomPolicyActions = { open: openAction, labels: LABELS };
})();
</script>
