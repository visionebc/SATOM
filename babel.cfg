# Extraction map for `pybabel extract`.
#
# Jinja templates are extracted with the jinja2 extension so `{% trans %}`
# blocks and `{{ _("...") }}` calls are both seen; `silent=false` makes a
# template that fails to parse a LOUD error instead of an empty catalogue —
# a silently skipped file would ship an untranslated page that nothing flags.
[python: app/**.py]
[jinja2: app/templates/**.html]
extensions=jinja2.ext.i18n
silent=false
