# Reverse-proxy vhost for SATOM.
#
# This is a SAMPLE. Replace satom.example.com with the name this node serves,
# point the certificate at your own files, and set the upstream to the address
# gunicorn binds on. The installer writes a real vhost from these values; this
# copy exists so the layout can be reviewed before running it.
#
# The upstream below is loopback because that is what the installer configures
# (gunicorn binds 127.0.0.1:8000 and only nginx reaches it). Publishing the
# application port on a routable address bypasses the TLS terminator.

server {
    listen 80;
    server_name satom.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name satom.example.com;

    ssl_certificate     /etc/nginx/ssl/satom.crt;
    ssl_certificate_key /etc/nginx/ssl/satom.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }
}
