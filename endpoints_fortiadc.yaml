# FortiADC REST endpoint registry SEED (product=fortiadc, api_version=v1).
#
# Same contract as endpoints.yaml (FortiWeb): flat friendly_key: urn map,
# INSERT-ONLY seeded into registry_endpoints at boot — DB edits/disables win.
#
# Derived 2026-07-07 from the FortiADC 8.0.3 CLI Reference ToC
# (docs.fortinet.com, Firecrawl harvest) with the URL rule
# "config a-b c-d" -> /api/a_b_c_d; entries also present in the official
# terraform-provider-fortiadc SDK are path-CONFIRMED. NOT yet probed against
# a live device (no lab FortiADC) — validate with the API explorer / probe
# once the VM exists. `config user tacacs+` was left out (unresolvable "+").
#
# Child tables follow /api/<parent>_child_<table>?pkey=<parent mkey>.

