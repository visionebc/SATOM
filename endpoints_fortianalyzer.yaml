# FortiAnalyzer JSON-RPC endpoint registry SEED (product=fortianalyzer,
# api_version=jsonrpc).
#
# Same contract as endpoints.yaml (FortiWeb) / endpoints_fortiadc.yaml:
# flat friendly_key: urn map, INSERT-ONLY seeded into registry_endpoints at
# boot — DB edits/disables win. This is the knob to turn when a FAZ upgrade
# moves an URI (the FortiWeb-API lesson): fix the URN in the Registry page,
# no code change needed.
#
# URNs are JSON-RPC *urls* (single transport endpoint POST /jsonrpc), NOT
# REST paths. Two dialects, auto-selected by the client from the URL family
# (see app/clients/fortianalyzer.py): /cli /dvmdb /sys /task = legacy
# envelope; /logview /eventmgmt /incidentmgmt /report /fortiview /fazsys =
# JSON-RPC 2.0 + apiver 3. ADOM-scoped URIs keep 'adom/root' — verified to
# work even with Admin Domains disabled on the unit.
#
# EVERY entry below was probed live (get, code 0) against faz01
# v7.6.7-build3737 on 2026-07-12 unless marked otherwise.

