auth_iam_accounts: /api/v1/iamaccounts/  # collection n=0, 3 fields, methods: get,post,patch
auth_iam_users: /api/v1/iamusers/  # collection n=0, 6 fields, methods: get,post,patch
auth_mac_devices: /api/v1/macdevices/  # collection n=0, 5 fields, methods: get,post
auth_mac_groups: /api/v1/macgroups/  # collection n=0, 4 fields, methods: get,post
auth_mac_group_members: /api/v1/macgroup-memberships/  # collection n=0, 7 fields, methods: get,post

