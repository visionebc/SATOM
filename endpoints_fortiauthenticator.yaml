# FortiAuthenticator REST endpoint registry SEED
# (product=fortiauthenticator, api_version=v1).
#
# Same contract as endpoints.yaml (FortiWeb) / endpoints_fortiadc.yaml /
# endpoints_fortianalyzer.yaml: a flat ``friendly_key: urn`` map, INSERT-ONLY
# seeded into registry_endpoints at boot — DB edits/disables always win. This
# is the knob to turn when a FAC upgrade moves a resource: fix the URN on the
# Registry page, no code change and no deploy.
#
# The API is Django/Tastypie, NOT the Fortinet CMDB dialect the other three
# products use:
#   * one path per resource: ``/api/v1/<resource>/``
#   * HTTP Basic auth with an API key issued PER USER (the login password is
#     NOT accepted — verified: 401)
#   * collections answer ``{"meta": {...}, "objects": [...]}``; several
#     resources are SINGLETONS and answer a bare object. The client detects the
#     shape at RUNTIME (app/clients/fortiauthenticator.py) instead of carrying a
#     second hand-written list that could rot out of sync with this one.
#
# EVERY entry below was probed live against fac01 (FACVMKVM v8.0.3 build0099)
# on 2026-08-05 and returned HTTP 200. Resources the device does NOT serve on
# GET are deliberately ABSENT — see the tail of this file for the full census,
# so a future reader knows they were considered and rejected, not overlooked.


# ---- System & platform ---------------------------------------------------------
system_info: /api/v1/systeminfo/  # singleton, methods: get
system_snmp_general: /api/v1/snmpgeneral/  # singleton, methods: get
system_snmp_hosts: /api/v1/snmp/  # collection n=0, 2 fields, methods: get,post
system_log_settings: /api/v1/logsettings/  # singleton, methods: get
system_scheduled_backup: /api/v1/scheduledbackupsettings/  # singleton, methods: get
system_ftp_servers: /api/v1/ftpservers/  # collection n=0, 9 fields, methods: get,post
system_smtp_servers: /api/v1/smtpservers/  # collection n=1, 11 fields, methods: get,post
system_syslog_servers: /api/v1/syslogservers/  # collection n=0, 7 fields, methods: get,post

