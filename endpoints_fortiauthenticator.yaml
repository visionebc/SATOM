# ---------------------------------------------------------------------------
# NOT seeded — census of the remaining 18 of the 58 advertised resources.
# Kept here as evidence: each was probed live and rejected for a stated reason.
#
# Action / POST-only (GET on the collection answers 405 — these DO things, they
# are not config to read, so they must never enter the SoT harvest):
#  auth, emergencytoken, idpsessiondata, licensing, localapiadmin,
#  offlinehotpupdate, offlineotp, realmauth, ssoauth, system,
#  upgrade
#
# Refused with 403 even holding a valid API key (privileged or internal):
#  csv, oauth, pushpoll, transfertoken
#
# Other live failures:
#  faccloudhost (HTTP 401), recovery (HTTP 500),
#  userfortitokenpolicy (HTTP 400)
#
# CAUTION — ``schema=500`` is NOT a broken endpoint. Tastypie's introspection
# crashes on the non-ORM singletons (8 of them, e.g. system_info,
# system_log_settings), yet every one of them serves GET 200 with real data.
# A registry seeded from "does /schema/ work?" would have silently dropped
# them. That is why the census above is keyed on the LIST response, not the
# schema response.
#
# VERIFIED WRITE-ONLY (canary round-trip, 2026-08-05): the device never returns
# ``radiusclients.secret`` nor ``localusers.password`` on read — both fields are
# absent from the GET payload entirely, so the SoT snapshot cannot leak them.
# Re-verify after a firmware upgrade before trusting it again.
#
# GOTCHA — ``POST /api/v1/localusers/`` is a BULK endpoint: it answers HTTP 207
# Multi-Status with a list body and NO Location header, and its per-item status
# key is misspelled ``statue`` (the vendor's typo). Code that looks for
# ``status`` or for a Location header will read a successful create as a
# failure.

